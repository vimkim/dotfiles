# Shared Codex preferences, managed by chezmoi and published in a public repository.
# Project trust, hook approvals, and UI state belong in local.config.toml (`--profile local`).
model = "gpt-6.1-sol"
approval_policy = "never"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "xhigh"

[tui]
alternate_screen = "always"
status_line = ["model-with-reasoning", "pull-request-number", "context-used", "context-window-size", "five-hour-limit", "weekly-limit", "task-progress", "approval-mode", "current-dir", "git-branch"]
status_line_use_colors = true

[tui.keymap.global]
leader = "ctrl-x"

[tui.keymap.chat]
# Native shortcut: press Ctrl+X, then C to cancel a turn.
interrupt_turn = "leader c"

[agents]
max_concurrent_threads_per_session = 6
max_depth = 2

[plugins."github@openai-curated"]
enabled = true

[notice]
hide_rate_limit_model_nudge = true
