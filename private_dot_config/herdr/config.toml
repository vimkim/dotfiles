onboarding = false

[experimental]
pane_history = false

[keys]
prefix = "ctrl+a"
workspace_picker = "alt+w"
previous_workspace = "alt+up"
next_workspace = "alt+down"
new_workspace = "alt+n"
switch_workspace = "alt+shift+1..9"
previous_agent = "alt+shift+up"
next_agent = "alt+shift+down"
new_tab = "alt+shift+n"
previous_tab = "alt+["
next_tab = "alt+]"
switch_tab = "alt+1..9"
edit_scrollback = "alt+e"
copy_mode = "alt+s"
focus_pane_left = ["alt+h", "alt+left"]
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = ["alt+l", "alt+right"]
split_vertical = "alt+v"
zoom = "alt+f"

[ui]
prompt_new_tab_name = false

[theme]
name = "catppuccin"

[theme.custom]
overlay0 = "#cad3f5"
