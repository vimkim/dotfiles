onboarding = false

[terminal]
default_shell = "herdr-shell"

[experimental]
pane_history = false

[keys]
prefix = "ctrl+a"

# Workspaces follow sidebar order.
workspace_picker = "alt+w"
previous_workspace = ["alt+p", "alt+up"]
next_workspace = ["alt+n", "alt+down"]
new_workspace = "alt+c"
rename_workspace = "alt+shift+w"
close_workspace = "alt+shift+x"
switch_workspace = ["alt+shift+1..9", "prefix+shift+1..9"]

# Tabs follow horizontal tab-bar order.
new_tab = "alt+t"
rename_tab = "alt+shift+t"
close_tab = "alt+x"
previous_tab = ["alt+h", "alt+left"]
next_tab = ["alt+i", "alt+right"]
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+i"
switch_tab = "alt+1..9"

edit_scrollback = "alt+e"
copy_mode = "alt+s"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
split_vertical = "alt+v"
zoom = "alt+f"

[[keys.command]]
key = ["alt+comma", "alt+shift+p", "alt+shift+up"]
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace up"
description = "move workspace up"

[[keys.command]]
key = ["alt+.", "alt+shift+n", "alt+shift+down"]
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace down"
description = "move workspace down"

[ui]
confirm_close = true
prompt_new_tab_name = false
agent_panel_sort = "priority"
host_cursor = "native"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "$git_dirty", "git_status"]]

[theme]
name = "catppuccin"

[theme.custom]
overlay0 = "#cad3f5"
