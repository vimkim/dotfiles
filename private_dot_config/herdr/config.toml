onboarding = false

[terminal]
default_shell = "herdr-shell"

[experimental]
pane_history = false

[keys]
prefix = "ctrl+a"

# Workspaces follow sidebar order.
workspace_picker = "alt+w"
previous_workspace = ["alt+p", "alt+up"]
next_workspace = ["alt+n", "alt+down"]
new_workspace = []
rename_workspace = "alt+shift+w"
close_workspace = "prefix+shift+d"
switch_workspace = ["alt+1..9", "prefix+shift+1..9"]

# Tabs follow horizontal tab-bar order.
new_tab = []
rename_tab = "alt+shift+t"
close_tab = "prefix+shift+x"
previous_tab = ["alt+h", "alt+left"]
next_tab = ["alt+i", "alt+right"]
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+i"
# Shifted numbers are !, @, #, $, %, ^, &, *, (.
switch_tab = "alt+shift+1..9"

edit_scrollback = "alt+e"
copy_mode = "alt+s"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
close_pane = "prefix+x"
split_vertical = "alt+v"
zoom = "alt+f"

[[keys.command]]
key = ["alt+comma", "alt+shift+p", "alt+shift+up"]
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace up"
description = "move workspace up"

[[keys.command]]
key = ["alt+.", "alt+shift+n", "alt+shift+down"]
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace down"
description = "move workspace down"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = '"$HOME/.local/bin/herdr-location" --popup'
description = "copy current location"
width = "80%"
height = "50%"

# Adjacent creation and the numbered source-to-anchor popup.
[[keys.command]]
key = "alt+t"
type = "shell"
command = '"$HOME/.local/bin/herdr-next-to-current" tab --quiet'
description = "new tab after current"

[[keys.command]]
key = "alt+c"
type = "shell"
command = '"$HOME/.local/bin/herdr-next-to-current" workspace --quiet'
description = "new Space below current"

[[keys.command]]
key = "alt+shift+c"
type = "popup"
command = '"$HOME/.local/bin/herdr-next-to-current" reorder --quiet'
description = "move current Space before number"
width = "80%"
height = "80%"

[ui]
confirm_close = true
prompt_new_tab_name = false
host_cursor = "native"

# Herdr's default delivery is "off": the client drops every popup, including
# `herdr notification show`, while the server still reports it as shown.
[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"

[theme.custom]
overlay0 = "#cad3f5"

[[keys.command]]
key = "alt+u"
type = "shell"
command = '"$HOME/.local/bin/herdr-attention" previous --quiet'
description = "previous workspace needing attention"

[[keys.command]]
key = "alt+o"
type = "shell"
command = '"$HOME/.local/bin/herdr-attention" next --quiet'
description = "next workspace needing attention"
