<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Markdown preview</title>
  <script src="/__serve_html__/theme.js"></script>
  <link rel="stylesheet" href="/__serve_html__/vendor/github-markdown.css">
  <link rel="stylesheet" href="/__serve_html__/viewer.css">
  <script type="module" src="/__serve_html__/viewer.js"></script>
</head>
<body>
  <header class="toolbar">
    <span id="filename">Markdown preview</span>
    <nav aria-label="Document"><a href="./">Files</a><a id="raw-link">Raw</a><button id="theme-toggle" type="button" aria-pressed="false" hidden>Dark mode</button></nav>
  </header>
  <main id="content" class="markdown-body" aria-busy="true">
    <p role="status">Loading Markdown…</p>
  </main>
  <noscript>Markdown preview needs JavaScript. Add ?raw=1 to the document URL to read its source.</noscript>
</body>
</html>
