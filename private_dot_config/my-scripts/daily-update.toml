# Projects run in this order. Paths expand ~; Git refresh precedes installation.
# Collections protect source identities and skill names from third-party pruning.
# Personal workflow decision (2026-10-22): exclude grill-tui,
# gh-pr-comments-fetch, cubrid-dev2-pr, and volmap from both daily updaters.
# These exclusions reflect the owner's workflow, not project quality or status.
# See docs/daily-update.md before reconsidering the inventory.
[[projects]]
name = "my-skills"
path = "~/gh/my-skills"
github = "vimkim/my-skills"
kind = "collection"

[[projects]]
name = "my-cubrid-skills"
path = "~/gh/my-cubrid-skills"
github = "vimkim/my-cubrid-skills"
kind = "collection"

[[projects]]
name = "my-git-utils"
path = "~/gh/my-git-utils"
github = "vimkim/my-git-utils"

# Protected tools use the canonical checkout and published origin/main only.
[[projects]]
name = "work-tracker"
path = "~/gh/work-tracker"
github = "vimkim/work-tracker"
primary_main = true
recipe = "install"

[[projects]]
name = "herdr-next-to-current"
path = "~/gh/herdr-next-to-current"
github = "vimkim/herdr-next-to-current"
primary_main = true

[[projects]]
name = "docserve"
path = "~/gh/docserve"
github = "vimkim/docserve"
primary_main = true

[[projects]]
name = "dirpick"
path = "~/gh/dirpick"
github = "vimkim/dirpick"
primary_main = true

[[projects]]
name = "cubrid-tc-chronicle"
path = "~/gh/cubrid-tc-chronicle"
github = "vimkim/cubrid-tc-chronicle"
primary_main = true
