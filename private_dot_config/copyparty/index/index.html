<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Copyparty Servers</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e6e9f2;
      background: #11131a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top left, #243058 0, transparent 38rem),
        radial-gradient(circle at bottom right, #263a35 0, transparent 34rem),
        #11131a;
    }

    main {
      width: min(54rem, 100%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4rem);
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 0.75rem 0 2rem;
      color: #aab0c3;
      font-size: 1.05rem;
    }

    .servers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
      gap: 1rem;
    }

    .server {
      display: block;
      min-height: 10rem;
      padding: 1.4rem;
      color: inherit;
      text-decoration: none;
      border: 1px solid #34394a;
      border-radius: 1rem;
      background: rgba(27, 30, 41, 0.88);
      box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.2);
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .server:hover,
    .server:focus-visible {
      transform: translateY(-0.25rem);
      border-color: #8ea1ff;
      background: #222637;
      outline: none;
    }

    .icon {
      display: block;
      margin-bottom: 1.2rem;
      font-size: 1.8rem;
    }

    .name {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .address {
      color: #9ca5c0;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Copyparty</h1>
    <p class="subtitle">Choose a server to continue.</p>
    <nav class="servers" id="servers" aria-label="Copyparty servers"></nav>
  </main>

  <script>
    const servers = [
      { name: "CUBRID Docs", port: 3923, icon: "📖" },
      { name: "CUBRID Develop", port: 3924, icon: "🛠️" },
      { name: "Learnings", port: 8888, icon: "🌱" },
    ];

    const hostname = location.hostname.includes(":")
      ? `[${location.hostname}]`
      : location.hostname;
    const container = document.querySelector("#servers");

    for (const server of servers) {
      const url = `${location.protocol}//${hostname}:${server.port}/`;
      const link = document.createElement("a");
      const icon = document.createElement("span");
      const name = document.createElement("span");
      const address = document.createElement("span");

      link.className = "server";
      link.href = url;
      icon.className = "icon";
      icon.textContent = server.icon;
      name.className = "name";
      name.textContent = server.name;
      address.className = "address";
      address.textContent = `${hostname}:${server.port}`;

      link.append(icon, name, address);
      container.append(link);
    }
  </script>
</body>
</html>
